{% comment %}Encabezado de sección. Parámetros: id, eyebrow, title, intro.{% endcomment %}
<div class="mb-10 max-w-2xl">
  {% if eyebrow %}<p class="eyebrow mb-3">{{ eyebrow }}</p>{% endif %}
  <h2 id="{{ id }}" class="heading-lg">{{ title }}</h2>
  {% if intro %}<p class="lead mt-4">{{ intro }}</p>{% endif %}
</div>
