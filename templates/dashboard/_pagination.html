{% if page.has_other_pages %}
  <nav aria-label="Páginas" class="mt-4 flex items-center justify-between gap-4">
    {% if page.has_previous %}<a class="btn btn-secondary btn-sm" href="{% querystring page=page.previous_page_number %}">Anteriores</a>{% else %}<span></span>{% endif %}
    <span class="note">Página {{ page.number }} de {{ page.paginator.num_pages }} · {{ page.paginator.count }} resultados</span>
    {% if page.has_next %}<a class="btn btn-secondary btn-sm" href="{% querystring page=page.next_page_number %}">Siguientes</a>{% else %}<span></span>{% endif %}
  </nav>
{% endif %}
