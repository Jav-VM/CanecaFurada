{% if field.widget_type == "checkbox" %}
<div class="field checkbox">
  {{ field }} <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
{% else %}
<div class="field">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}
    {% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden"> (obligatorio)</span>{% else %}<span class="optional-mark">(opcional)</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {{ field.errors }}
</div>
{% endif %}
