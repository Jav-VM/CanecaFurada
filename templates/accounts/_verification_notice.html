{% load i18n %}
{% if not user.is_email_verified %}
<div class="alert alert-warning mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <p class="font-bold">{% translate "Tu email está pendiente de verificación." %}</p>
    <p class="mt-1 text-sm text-mist">{% translate "Hasta que lo confirmes no podrás usar las funciones que lo requieren (puntos, canjes, reservas) ni recibirás promociones." %}</p>
  </div>
  <form method="post" action="{% url 'accounts:resend_verification_self' %}" data-loading class="shrink-0">
    {% csrf_token %}
    <button type="submit" class="btn btn-secondary" data-loading-text="{% translate 'Enviando…' %}">{% translate "Reenviar enlace de verificación" %}</button>
  </form>
</div>
{% endif %}
