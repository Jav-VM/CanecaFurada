{% load i18n %}
<dl class="grid grid-cols-3 gap-3" data-summary>
  <div class="stat"><dt class="stat-label">{% translate "Compras" %}</dt><dd class="stat-value" data-summary-purchases>{{ summary.purchases_count }}</dd></div>
  <div class="stat"><dt class="stat-label">{% translate "Importe registrado" %}</dt><dd class="stat-value" data-summary-amount>{{ summary.purchases_amount|floatformat:2 }} €</dd></div>
  <div class="stat"><dt class="stat-label">{% translate "Canjes" %}</dt><dd class="stat-value" data-summary-validations>{{ summary.validations_count }}</dd></div>
</dl>
