{# Confirmación visible de una operación terminada. Parámetro: text. #}
<div class="done-banner" data-operation-done>
  <svg aria-hidden="true" viewBox="0 0 24 24" class="size-10 shrink-0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  <p class="text-lg font-extrabold uppercase">{{ text }}</p>
</div>
