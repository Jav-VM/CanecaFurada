  /api/v1/owner/reservations/:
    get:
      operationId: owner_reservations_list
      description: Sin datos de contacto del cliente (solo nombre corto). Ordenadas
        por fecha de la reserva.
      summary: Reservas
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Desde (incluido), AAAA-MM-DD.
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Hasta (incluido), AAAA-MM-DD.
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETED
          - CONFIRMED
          - PENDING
          - REJECTED
        description: Filtra por estado.
      tags:
      - Propietario
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOwnerReservationList'
          description: ''
  /api/v1/owner/reservations/{public_id}/{action}/:
    post:
      operationId: owner_reservations_create
      description: '`action`: `confirm`, `reject`, `cancel` o `complete`. El cliente
        recibe el aviso por email. `message` no aplica a `complete`. Errores: `invalid_transition`,
        `event_full` (409); `in_the_past`, `too_early` (400).'
      summary: Cambiar el estado de una reserva
      parameters:
      - in: path
        name: action
        schema:
          type: string
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Propietario
      requestBody:
