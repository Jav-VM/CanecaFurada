  /api/v1/rewards/{public_id}/redeem/:
    post:
      operationId: rewards_redeem_create
      description: 'Descuenta los puntos y devuelve el canje con su código de un solo
        uso. Errores: `insufficient_points`, `reward_unavailable`, `out_of_stock`
        (400); `duplicate_pending`, `idempotency_conflict` (409).'
      summary: Canjear una recompensa
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: 'UUID v4 generado por la app para esta operación. Si la respuesta
          se pierde, reintenta con el mismo valor: no se duplica (200 en lugar de
          201).'
        required: true
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Recompensas y canjes
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionDetail'
          description: ''
        '200':
          content:
            application/json:
