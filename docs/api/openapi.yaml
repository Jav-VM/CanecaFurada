        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
    PaginatedOwnerReservationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OwnerReservation'
    PaginatedRedemptionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Redemption'
    PaginatedReservationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Reservation'
    PaginatedRewardList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Reward'
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - current_password
      - new_password
    PasswordResetConfirmRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
          description: Segmento `uidb64` del enlace del email.
          maxLength: 64
        token:
          type: string
          minLength: 1
          description: Segmento `token` del enlace del email.
          maxLength: 128
        new_password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - new_password
      - token
      - uid
    PatchedPreferencesRequest:
      type: object
      properties:
        promo_email_opt_in:
          type: boolean
          description: Acepta emails promocionales.
        promo_sms_opt_in:
          type: boolean
          description: Acepta SMS promocionales (requiere teléfono).
    PatchedProfileRequest:
      type: object
      description: Para `PATCH` todos los campos son opcionales; los no enviados no
        cambian.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        date_of_birth:
          type: string
          format: date
          description: AAAA-MM-DD. Solo se puede cambiar una vez al año (protege las
            promociones de cumpleaños).
        phone_number:
          type: string
          description: Vacío para borrarlo.
          maxLength: 32
        address_line_1:
          type: string
          minLength: 1
          maxLength: 200
        address_line_2:
          type: string
          maxLength: 200
        postal_code:
          type: string
          minLength: 1
          maxLength: 12
        city:
          type: string
          minLength: 1
          maxLength: 100
        province:
          type: string
          minLength: 1
          maxLength: 100
        country:
          type: string
          minLength: 1
          description: ISO 3166-1 alfa-2.
          maxLength: 2
    PointsSummary:
      type: object
      properties:
        balance:
          type: integer
          description: Saldo actual (suma de todos los movimientos).
        earned:
          type: integer
          description: 'Obtenidos: compras, promociones y ajustes a favor.'
        used:
          type: integer
          description: Gastados en canjes, descontadas las devoluciones.
        corrected:
          type: integer
          description: Restados por compensaciones o ajustes en contra.
        expired:
          type: integer
          description: Caducados según la caducidad de los puntos (Fase 14).
      required:
      - balance
      - corrected
      - earned
      - expired
      - used
    Preferences:
      type: object
      properties:
        promo_email_opt_in:
          type: boolean
          description: Acepta emails promocionales.
        promo_sms_opt_in:
          type: boolean
          description: Acepta SMS promocionales (requiere teléfono).
      required:
      - promo_email_opt_in
      - promo_sms_opt_in
    Profile:
      type: object
      description: Para `PATCH` todos los campos son opcionales; los no enviados no
        cambian.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        date_of_birth:
          type: string
          format: date
          description: AAAA-MM-DD. Solo se puede cambiar una vez al año (protege las
            promociones de cumpleaños).
        phone_number:
          type: string
          description: Vacío para borrarlo.
          maxLength: 32
        address_line_1:
          type: string
          maxLength: 200
        address_line_2:
          type: string
          maxLength: 200
        postal_code:
          type: string
          maxLength: 12
        city:
          type: string
          maxLength: 100
        province:
          type: string
          maxLength: 100
        country:
          type: string
          description: ISO 3166-1 alfa-2.
          maxLength: 2
        missing_fields:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - address_line_1
      - address_line_2
      - city
      - country
      - date_of_birth
      - first_name
      - last_name
      - missing_fields
      - phone_number
      - postal_code
      - province
    PurchaseCreateRequest:
      type: object
      properties:
        qr_code:
          type: string
          minLength: 1
          description: Contenido leído del QR (`CF1:…`) o código tecleado.
          maxLength: 100
        amount:
          type: string
          minLength: 1
          description: 'Importe en euros con hasta dos decimales: "12.50". El servidor
            calcula los puntos.'
          maxLength: 20
      required:
      - amount
      - qr_code
    PurchaseStatusEnum:
      enum:
      - COMPLETED
      - VOIDED
      type: string
      description: |-
        * `COMPLETED` - Registrada
        * `VOIDED` - Anulada
    QRCode:
      type: object
      properties:
        payload:
          type: string
          description: Contenido del QR que la app debe dibujar (`CF1:…`).
        code:
          type: string
          description: El mismo código en grupos de 4, para teclearlo a mano.
        rotated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - code
      - payload
      - rotated_at
    QRCodeInputRequest:
      type: object
      properties:
        qr_code:
          type: string
          minLength: 1
          description: Contenido leído del QR (`CF1:…`) o código tecleado.
          maxLength: 100
      required:
      - qr_code
    Redemption:
      type: object
      description: 'Listado: nunca incluye el código.'
      properties:
        public_id:
          type: string
          format: uuid
        reward:
          $ref: '#/components/schemas/_RewardRef'
        points_cost:
          type: integer
        status:
          $ref: '#/components/schemas/RedemptionStatusEnum'
        status_display:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        validated_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - closed_at
      - created_at
      - expires_at
      - points_cost
      - public_id
      - reward
      - status
      - status_display
      - validated_at
    RedemptionCodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Contenido del QR del canje (`CFR1:…`) o código tecleado.
          maxLength: 100
      required:
      - code
    RedemptionDetail:
      type: object
      description: 'Detalle del propio canje: el código y el contenido del QR solo
        mientras se puede recoger.'
      properties:
        public_id:
          type: string
          format: uuid
        reward:
          $ref: '#/components/schemas/_RewardRef'
        points_cost:
          type: integer
        status:
          $ref: '#/components/schemas/RedemptionStatusEnum'
        status_display:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        validated_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        is_expired:
          type: boolean
          readOnly: true
        code:
          type: string
          nullable: true
          readOnly: true
          description: Solo si está pendiente y vigente; si no, null.
        qr_payload:
          type: string
          nullable: true
          readOnly: true
          description: Contenido del QR (`CFR1:…`) o null.
      required:
      - closed_at
      - code
      - created_at
      - expires_at
      - is_expired
      - points_cost
      - public_id
      - qr_payload
      - reward
      - status
      - status_display
      - validated_at
    RedemptionPreview:
      type: object
      description: Sin email, teléfono ni saldo del cliente.
      properties:
        customer_name:
          type: string
        reward_name:
          type: string
        points_cost:
          type: integer
        status:
          $ref: '#/components/schemas/RedemptionStatusEnum'
        status_display:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        validated_at:
          type: string
          format: date-time
          nullable: true
        can_validate:
          type: boolean
      required:
      - can_validate
      - created_at
      - customer_name
      - expires_at
      - points_cost
      - reward_name
      - status
      - status_display
      - validated_at
    RedemptionStatusEnum:
      enum:
      - PENDING
      - USED
      - EXPIRED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pendiente de recoger
        * `USED` - Canjeado
        * `EXPIRED` - Caducado
        * `CANCELLED` - Cancelado
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 2000
      required:
      - refresh
    RegisterRequest:
      type: object
      description: 'Registro público: siempre crea un cliente (no existe ningún campo
        de rol).'
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: Mínimo 10 caracteres; no común ni solo números.
          maxLength: 128
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        date_of_birth:
          type: string
          format: date
          description: AAAA-MM-DD. Edad mínima configurable (18 por defecto).
        phone_number:
          type: string
          default: ''
          maxLength: 32
        address_line_1:
          type: string
          minLength: 1
          maxLength: 200
        address_line_2:
          type: string
          default: ''
          maxLength: 200
        postal_code:
          type: string
          minLength: 1
          maxLength: 12
        city:
          type: string
          minLength: 1
          maxLength: 100
        province:
          type: string
          minLength: 1
          maxLength: 100
        country:
          type: string
          minLength: 1
          default: ES
          description: ISO 3166-1 alfa-2.
          maxLength: 2
        promo_email_opt_in:
          type: boolean
          default: false
        promo_sms_opt_in:
          type: boolean
          default: false
      required:
      - address_line_1
      - city
      - date_of_birth
      - email
      - first_name
      - last_name
      - password
      - postal_code
      - province
    Reservation:
      type: object
      description: 'Reserva propia: sin quién cambió el estado ni referencias internas.'
      properties:
        public_id:
          type: string
          format: uuid
        event:
          allOf:
          - $ref: '#/components/schemas/_EventRef'
          nullable: true
        requested_for:
          type: string
          format: date-time
        party_size:
          type: integer
        notes:
          type: string
        status:
          $ref: '#/components/schemas/ReservationStatusEnum'
        status_display:
          type: string
        owner_message:
          type: string
          description: Mensaje del local.
        created_at:
          type: string
          format: date-time
        status_changed_at:
          type: string
          format: date-time
          nullable: true
        can_cancel:
          type: boolean
          readOnly: true
      required:
      - can_cancel
      - created_at
      - event
      - notes
      - owner_message
      - party_size
      - public_id
      - requested_for
      - status
      - status_changed_at
      - status_display
    ReservationCreateRequest:
      type: object
      description: |-
        Reserva de un evento (`event`) o de mesa (`requested_for`). Con `event` se
        usa la hora del evento y se ignora `requested_for`. El estado, el cliente y
        el mensaje del local no se pueden enviar.
      properties:
        event:
          type: string
          format: uuid
          nullable: true
        requested_for:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 con zona horaria (solo mesa).
        party_size:
          type: integer
          maximum: 50
          minimum: 1
        notes:
          type: string
          default: ''
          maxLength: 300
      required:
      - party_size
    ReservationDecisionRequest:
      type: object
      properties:
        message:
          type: string
          default: ''
          description: Se muestra al cliente y va en el email.
          maxLength: 300
    ReservationStatusEnum:
      enum:
      - PENDING
      - CONFIRMED
      - REJECTED
      - CANCELLED
      - COMPLETED
      type: string
      description: |-
        * `PENDING` - Pendiente de confirmar
        * `CONFIRMED` - Confirmada
        * `REJECTED` - Rechazada
        * `CANCELLED` - Cancelada
        * `COMPLETED` - Completada
    Reward:
      type: object
      description: 'Sin estado de gestión, orden ni número de unidades: solo si quedan.'
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        image_url:
          type: string
          nullable: true
          readOnly: true
        image_width:
          type: integer
          nullable: true
        image_height:
          type: integer
          nullable: true
        points_cost:
          type: integer
        valid_until:
          type: string
          format: date-time
          nullable: true
        in_stock:
          type: boolean
      required:
      - description
      - image_height
      - image_url
      - image_width
      - in_stock
      - name
      - points_cost
      - public_id
      - valid_until
    RoleEnum:
      enum:
      - OWNER
      - EMPLOYEE
      - CUSTOMER
      type: string
      description: |-
        * `OWNER` - Propietario
        * `EMPLOYEE` - Empleado
        * `CUSTOMER` - Cliente
    SourceEnum:
      enum:
      - MANUAL
      - POS
      type: string
      description: |-
        * `MANUAL` - Manual (panel del personal)
        * `POS` - TPV
    StaffPurchase:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/SourceEnum'
        status:
          $ref: '#/components/schemas/PurchaseStatusEnum'
        points:
          type: integer
        customer_name:
          type: string
      required:
      - amount
      - created_at
      - customer_name
      - points
      - public_id
      - source
      - status
    TokenPair:
      type: object
      description: Solo salida (documentación).
      properties:
        access:
          type: string
        refresh:
          type: string
        token_type:
          type: string
        access_expires_in:
          type: integer
          description: Segundos.
        refresh_expires_in:
          type: integer
          description: Segundos.
      required:
      - access
      - access_expires_in
      - refresh
      - refresh_expires_in
      - token_type
    TokenToVerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          description: Último segmento del enlace del email.
          maxLength: 128
      required:
      - token
    ValidatedRedemption:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        reward_name:
          type: string
        points_cost:
          type: integer
        status:
          $ref: '#/components/schemas/RedemptionStatusEnum'
        validated_at:
          type: string
          format: date-time
        customer_name:
          type: string
      required:
      - customer_name
      - points_cost
      - public_id
      - reward_name
      - status
      - validated_at
    _CustomersStats:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        verified:
          type: integer
        promo_email:
          type: integer
          description: Clientes activos con consentimiento de email promocional.
        new_in_period:
          type: integer
      required:
      - active
      - new_in_period
      - promo_email
      - total
      - verified
    _EventRef:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        title:
          type: string
      required:
      - public_id
      - title
    _Period:
      type: object
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
      required:
      - date_from
      - date_to
    _PointsStats:
      type: object
      properties:
        issued:
          type: integer
        used:
          type: integer
        corrected:
          type: integer
        expired:
          type: integer
          description: Puntos caducados en el periodo.
        outstanding:
          type: integer
          description: Saldo pendiente de todos los clientes (sin filtro de fechas).
        customers_with_points:
          type: integer
      required:
      - corrected
      - customers_with_points
      - expired
      - issued
      - outstanding
      - used
    _PromotionRef:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - name
      - public_id
    _PurchasesStats:
      type: object
      properties:
        label:
          type: string
        note:
          type: string
          description: Las compras registradas no son la facturación del local.
        purchases_count:
          type: integer
        customers_count:
          type: integer
        registered_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        average_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        business_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: 'Siempre null: no se conoce.'
      required:
      - average_amount
      - business_revenue
      - customers_count
      - label
      - note
      - purchases_count
      - registered_amount
    _RedemptionStats:
      type: object
      properties:
        requested:
          type: integer
        used:
          type: integer
        closed:
          type: integer
        pending_now:
          type: integer
      required:
      - closed
      - pending_now
      - requested
      - used
    _ReservationStats:
      type: object
      properties:
        requested:
          type: integer
        confirmed:
          type: integer
        pending_now:
          type: integer
        upcoming_confirmed:
          type: integer
        upcoming_events:
          type: integer
      required:
      - confirmed
      - pending_now
      - requested
      - upcoming_confirmed
      - upcoming_events
    _RewardRef:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - name
      - public_id
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token de acceso de `POST /api/v1/auth/login/` en la cabecera `Authorization:
        Bearer <access>`. Caduca a los 15 minutos; se renueva con `POST /api/v1/auth/token/refresh/`.'
