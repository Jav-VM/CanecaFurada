openapi: 3.0.3
info:
  title: Caneca Furada API
  version: 1.0.0
  description: 'API REST v1 para la app móvil de Caneca Furada. Autenticación con
    JWT (`Authorization: Bearer <access>`). Guía: docs/guia-app-flutter.md.'
paths:
  /api/v1/auth/email/resend/:
    post:
      operationId: auth_email_resend_create
      description: Responde siempre igual, exista o no la cuenta.
      summary: Reenviar verificación (sin sesión)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      description: 'Confirma el alta o un cambio de email con el token del enlace
        (`/cuenta/verificar-email/<token>/`). Errores: `invalid`, `expired`, `used`,
        `revoked`, `email_taken`.'
      summary: Confirmar email
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenToVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Devuelve `access` (15 min) y `refresh` (30 días) y los datos básicos
        del usuario (`user`). Mismo límite de intentos fallidos por email e IP que
        la web. Una cuenta con el email sin verificar puede entrar, pero no usar puntos,
        QR, canjes ni reservas.
      summary: Iniciar sesión
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: 'Revoca el `refresh` enviado. El `access` sigue valiendo hasta
        que caduque (máx. 15 min): bórralo.'
      summary: Cerrar sesión en este dispositivo
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      description: Revoca todos los `refresh` de la cuenta (queda auditado).
      summary: Cerrar sesión en todos los dispositivos
      tags:
      - Autenticación
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Exige la contraseña actual. Invalida al momento todos los tokens
        y sesiones anteriores (también en otros dispositivos y en la web) y devuelve
        un par nuevo para este dispositivo.
      summary: Cambiar contraseña
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Envía el enlace de recuperación nativo de Django (`/cuenta/contrasena/restablecer/<uid>/<token>/`).
        Responde siempre igual, exista o no la cuenta.
      summary: Recuperar cuenta
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Para cuando la app abre el enlace del email (enlace universal /
        App Link). Error `invalid_token` si el enlace caducó o ya se usó. Invalida
        todos los tokens anteriores.
      summary: Elegir contraseña nueva con el enlace
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Crea una cuenta de **cliente** (no se puede elegir rol) con el
        email pendiente de verificar y envía el enlace de verificación. Si el email
        ya existe responde igual (202) y avisa al titular.
      summary: Registro de cliente
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Entrega un par nuevo y revoca el `refresh` usado (rotación). Guarda
        siempre el último `refresh`. 401 `token_not_valid` si caducó, se revocó, la
        contraseña cambió o la cuenta se desactivó.
      summary: Renovar tokens
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/events/:
    get:
      operationId: events_list
      description: Publicados y no terminados, por fecha.
      summary: Eventos publicados
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Eventos y reservas
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
  /api/v1/events/{public_id}/:
    get:
      operationId: events_retrieve
      description: 'Las respuestas llevan datos de la cuenta, saldos o códigos: ni
        el navegador ni los proxies las guardan.'
      summary: Un evento
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Eventos y reservas
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: Sin dirección, fecha de nacimiento, teléfono ni preferencias (ver
        `/me/profile/`).
      summary: Mis datos básicos
      tags:
      - Mi cuenta
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/email/change/:
    post:
      operationId: me_email_change_create
      description: Exige la contraseña. Envía un enlace a la nueva dirección; el email
        no cambia hasta confirmarlo (`POST /auth/email/verify/`). No revela si la
        nueva dirección ya está en uso.
      summary: Cambiar mi email
      tags:
      - Mi cuenta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/email/resend-verification/:
    post:
      operationId: me_email_resend_verification_create
      description: 'Las respuestas llevan datos de la cuenta, saldos o códigos: ni
        el navegador ni los proxies las guardan.'
      summary: Reenviarme el enlace de verificación
      tags:
      - Mi cuenta
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/points/:
    get:
      operationId: me_points_retrieve
      description: 'Las respuestas llevan datos de la cuenta, saldos o códigos: ni
        el navegador ni los proxies las guardan.'
      summary: Mi saldo de puntos
      tags:
      - Puntos y QR
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsSummary'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/points/movements/:
    get:
      operationId: me_points_movements_list
      description: Del más reciente al más antiguo.
      summary: Mis movimientos de puntos
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Puntos y QR
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMovementList'
          description: ''
  /api/v1/me/preferences/:
    get:
      operationId: me_preferences_retrieve
      description: 'Las respuestas llevan datos de la cuenta, saldos o códigos: ni
        el navegador ni los proxies las guardan.'
      summary: Mis preferencias de comunicación
      tags:
      - Mi cuenta
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: me_preferences_partial_update
      description: Cada cambio queda en el historial de consentimientos. Los SMS requieren
        un teléfono en el perfil.
      summary: Cambiar mis preferencias
      tags:
      - Mi cuenta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPreferencesRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/profile/:
    get:
      operationId: me_profile_retrieve
      description: 'Las respuestas llevan datos de la cuenta, saldos o códigos: ni
        el navegador ni los proxies las guardan.'
      summary: Mi perfil de cliente
      tags:
      - Mi cuenta
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: me_profile_partial_update
      description: Solo se cambian los campos enviados. El email se cambia en `/me/email/change/`.
        Los obligatorios deben quedar completos; la fecha de nacimiento se puede cambiar
        una vez al año.
      summary: Modificar mi perfil
      tags:
      - Mi cuenta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/purchases/:
    get:
      operationId: me_purchases_list
      description: Con los puntos que generó cada una.
      summary: Mis compras registradas
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Puntos y QR
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerPurchaseList'
          description: ''
  /api/v1/me/qr/:
    get:
      operationId: me_qr_retrieve
      description: Contenido del QR para dibujarlo en la app. Solo identifica al cliente
        en barra; no autoriza nada. No lo guardes en registros ni lo envíes a analítica.
      summary: Mi QR personal
      tags:
      - Puntos y QR
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/qr/rotate/:
    post:
      operationId: me_qr_rotate_create
      description: El código anterior deja de valer. Máximo 5 renovaciones al día.
      summary: Renovar mi QR
      tags:
      - Puntos y QR
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCode'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/redemptions/:
    get:
      operationId: me_redemptions_list
      description: 'Sin códigos: el código solo está en el detalle.'
      summary: Mis canjes
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Recompensas y canjes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRedemptionList'
          description: ''
  /api/v1/me/redemptions/{public_id}/:
    get:
      operationId: me_redemptions_retrieve
      description: Incluye `code` y `qr_payload` solo si está pendiente y vigente.
      summary: Uno de mis canjes
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Recompensas y canjes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/redemptions/{public_id}/cancel/:
    post:
      operationId: me_redemptions_cancel_create
      description: Devuelve los puntos. Idempotente. 409 `code_not_pending` si ya
        se usó o caducó.
      summary: Cancelar uno de mis canjes
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Recompensas y canjes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/reservations/:
    get:
      operationId: me_reservations_list
      description: 'Las respuestas llevan datos de la cuenta, saldos o códigos: ni
        el navegador ni los proxies las guardan.'
      summary: Mis reservas
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      tags:
      - Eventos y reservas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationList'
          description: ''
    post:
      operationId: me_reservations_create
      description: 'De un evento (`event`) o de mesa (`requested_for`). Queda pendiente
        hasta que el local la confirme (se avisa por email). Errores: `event_not_bookable`,
        `too_many_active` (400); `already_reserved`, `event_full` (409); `rate_limited`
        (429).'
      summary: Solicitar una reserva
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: 'UUID v4 generado por la app para esta operación. Si la respuesta
          se pierde, reintenta con el mismo valor: no se duplica (200 en lugar de
          201).'
        required: true
      tags:
      - Eventos y reservas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/reservations/{public_id}/:
    get:
      operationId: me_reservations_retrieve
      description: 'Las respuestas llevan datos de la cuenta, saldos o códigos: ni
        el navegador ni los proxies las guardan.'
      summary: Una de mis reservas
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Eventos y reservas
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/reservations/{public_id}/cancel/:
    post:
      operationId: me_reservations_cancel_create
      description: Pendiente o confirmada y antes de su hora. Idempotente.
      summary: Cancelar una de mis reservas
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
