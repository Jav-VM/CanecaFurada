components:
  schemas:
    CustomerPurchase:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          description: 'Euros como texto: "12.50".'
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PurchaseStatusEnum'
        status_display:
          type: string
        points:
          type: integer
          description: Puntos que generó la compra (incluidas promociones).
      required:
      - amount
      - created_at
      - points
      - public_id
      - status
      - status_display
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EmailChangeRequest:
      type: object
      properties:
        new_email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - new_email
      - password
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    Error:
      type: object
      properties:
        code:
          type: string
          description: Identificador estable del error.
        detail:
          type: string
          description: Mensaje legible en español.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Errores por campo (solo en validaciones).
      required:
      - code
      - detail
    Event:
      type: object
      description: Solo eventos publicados; sin estado de gestión ni fechas internas.
      properties:
        public_id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        image_url:
          type: string
          nullable: true
          readOnly: true
        accepts_reservations:
          type: boolean
        bookable:
          type: boolean
          readOnly: true
          description: Se puede pedir reserva ahora mismo.
      required:
      - accepts_reservations
      - bookable
      - description
      - ends_at
      - image_url
      - public_id
      - starts_at
      - summary
      - title
    EventDetail:
      type: object
      description: Solo eventos publicados; sin estado de gestión ni fechas internas.
      properties:
        public_id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        image_url:
          type: string
          nullable: true
          readOnly: true
        accepts_reservations:
          type: boolean
        bookable:
          type: boolean
          readOnly: true
          description: Se puede pedir reserva ahora mismo.
        seats_left:
          type: integer
          nullable: true
          readOnly: true
          description: Plazas libres; null si no hay límite.
      required:
      - accepts_reservations
      - bookable
      - description
      - ends_at
      - image_url
      - public_id
      - seats_left
      - starts_at
      - summary
      - title
    IdentifiedCustomer:
      type: object
      properties:
        display_name:
          type: string
          description: Nombre e inicial del apellido, para confirmar en barra.
      required:
      - display_name
    KindEnum:
      enum:
      - EARN_PURCHASE
      - PROMOTION_BONUS
      - ADJUSTMENT
      - REVERSAL
      - REDEMPTION
      - BIRTHDAY_GIFT
      - EXPIRATION
      type: string
      description: |-
        * `EARN_PURCHASE` - Compra
        * `PROMOTION_BONUS` - Promoción
        * `ADJUSTMENT` - Ajuste manual
        * `REVERSAL` - Compensación
        * `REDEMPTION` - Canje
        * `BIRTHDAY_GIFT` - Regalo de cumpleaños
        * `EXPIRATION` - Puntos caducados
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    Me:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
        profile_complete:
          type: boolean
          nullable: true
          readOnly: true
          description: 'Solo clientes: faltan datos obligatorios del perfil si es
            false. `null` para el personal.'
      required:
      - email
      - email_verified
      - first_name
      - last_name
      - profile_complete
      - public_id
      - role
    Movement:
      type: object
      description: Sin motivo interno, autor, regla ni referencias de idempotencia.
      properties:
        public_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/KindEnum'
        kind_display:
          type: string
        points:
          type: integer
        balance_after:
          type: integer
        created_at:
          type: string
          format: date-time
        promotion:
          allOf:
          - $ref: '#/components/schemas/_PromotionRef'
          nullable: true
        purchase:
          type: string
          format: uuid
          nullable: true
      required:
      - balance_after
      - created_at
      - kind
      - kind_display
      - points
      - promotion
      - public_id
    OwnerReservation:
      type: object
      description: 'Listado del propietario: sin datos de contacto (como el dashboard).'
      properties:
        public_id:
          type: string
          format: uuid
        event:
          allOf:
          - $ref: '#/components/schemas/_EventRef'
          nullable: true
        requested_for:
          type: string
          format: date-time
        party_size:
          type: integer
        status:
          $ref: '#/components/schemas/ReservationStatusEnum'
        status_display:
          type: string
        created_at:
          type: string
          format: date-time
        customer_name:
          type: string
          readOnly: true
          description: Nombre e inicial del apellido.
      required:
      - created_at
      - customer_name
      - event
      - party_size
      - public_id
      - requested_for
      - status
      - status_display
    OwnerStats:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/_Period'
        customers:
          $ref: '#/components/schemas/_CustomersStats'
        purchases:
          $ref: '#/components/schemas/_PurchasesStats'
        points:
          $ref: '#/components/schemas/_PointsStats'
        redemptions:
          $ref: '#/components/schemas/_RedemptionStats'
        reservations:
          $ref: '#/components/schemas/_ReservationStats'
      required:
      - customers
      - period
      - points
      - purchases
      - redemptions
      - reservations
    PaginatedCustomerPurchaseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CustomerPurchase'
    PaginatedEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    PaginatedMovementList:
      type: object
